<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>code-function</title>
<style>
/* ============================================================
   code-function — original viewer · terminal edition
   layout: fixed left nav · force-directed arch · icicle files
   ============================================================ */
:root{
  color-scheme: dark;
  --bg:#080b09; --surface:#0c110d; --surface2:#101711; --line:#1b2a1f;
  --ink:#d6f7df; --ink2:#7db08c; --ink3:#486450;
  --accent:#39ff14; --accent-ink:#08130a; --amber:#ffb000; --red:#ff5c5c;
  --c1:#39ff14; --c2:#22d3ee; --c3:#ffb000; --c4:#a3e635; --c5:#e879f9;
  --c6:#ff5c5c; --c7:#f472b6; --c8:#ff8c42; --c9:#5b9dff; --c10:#2dd4bf; --c-other:#5c6b60;
  --mono: ui-monospace,"SFMono-Regular","JetBrains Mono","Cascadia Code",Menlo,Consolas,monospace;
  --shadow: 0 1px 0 rgba(57,255,20,.04), 0 10px 30px rgba(0,0,0,.5);
  --grid: rgba(57,255,20,.05);
}
:root[data-theme="light"]{
  color-scheme: light;
  --bg:#f4f2ea; --surface:#fffef9; --surface2:#ece9dd; --line:#d7d3c2;
  --ink:#12160e; --ink2:#4c5540; --ink3:#8a927c;
  --accent:#0a7d1f; --accent-ink:#f4f2ea; --amber:#a4600a; --red:#c02626;
  --c1:#0a7d1f; --c2:#0e7490; --c3:#a4600a; --c4:#4d7c0f; --c5:#a21caf;
  --c6:#c02626; --c7:#be185d; --c8:#c2410c; --c9:#1d4ed8; --c10:#0f766e; --c-other:#9aa093;
  --shadow: 0 1px 0 rgba(0,0,0,.03), 0 8px 24px rgba(30,30,20,.08);
  --grid: rgba(10,125,31,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:13px;line-height:1.55;-webkit-font-smoothing:antialiased;
  display:grid;grid-template-columns:238px minmax(0,1fr);min-height:100vh}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
::selection{background:var(--accent);color:var(--accent-ink)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- sidebar ---------- */
aside{position:sticky;top:0;height:100vh;overflow-y:auto;border-right:1px solid var(--line);background:var(--surface);
  display:flex;flex-direction:column;padding:16px 14px 18px;gap:16px}
.brand{font-size:15px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
.brand .cur{color:var(--accent);animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.brand .sub{display:block;font-size:9.5px;font-weight:400;color:var(--ink3);letter-spacing:.12em;text-transform:uppercase;margin-top:4px}
nav{display:flex;flex-direction:column;gap:1px}
nav button{display:flex;align-items:center;gap:9px;text-align:left;padding:8px 10px;border-radius:6px;color:var(--ink2);font-size:12px;border-left:2px solid transparent}
nav button:hover{background:var(--surface2);color:var(--ink)}
nav button[aria-selected="true"]{background:var(--surface2);color:var(--accent);border-left-color:var(--accent)}
nav button .idx{color:var(--ink3);font-size:10px}
nav button[aria-selected="true"] .idx{color:var(--accent)}
.statlist{border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);padding:12px 2px;display:flex;flex-direction:column;gap:9px}
.statlist .row{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.statlist .v{font-size:16px;font-weight:700;color:var(--ink)}
.statlist .l{font-size:9.5px;color:var(--ink3);text-align:right}
.sideblock h4{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin-bottom:6px}
.sideblock select{width:100%;background:var(--surface2);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-family:var(--mono);font-size:11.5px}
.sidefoot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.theme-btn{width:100%;text-align:center;font-size:11px;border:1px solid var(--line);border-radius:6px;padding:7px;color:var(--ink2);background:var(--surface2)}
.theme-btn:hover{border-color:var(--accent);color:var(--accent)}
.sidefoot .meta{font-size:9.5px;color:var(--ink3);word-break:break-all;line-height:1.5}

/* ---------- main ---------- */
main{min-width:0;padding:22px 28px 70px;position:relative}
.crt{position:fixed;inset:0;pointer-events:none;z-index:0;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:26px 26px;opacity:.6}
.view{position:relative;z-index:1;display:none}
.view.on{display:block;animation:in .18s ease}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.vhead{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px;border-bottom:1px solid var(--line);padding-bottom:12px}
.vhead h2{font-size:15px;font-weight:700;color:var(--ink)}
.vhead h2::before{content:"// ";color:var(--accent)}
.vhead .sub{font-size:11px;color:var(--ink3)}

.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.toolbar input[type=search]{font-family:var(--mono);font-size:12px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px 11px;min-width:240px;flex:1;max-width:420px}
.toolbar input:focus{outline:none;border-color:var(--accent)}
.pill{font-size:10.5px;color:var(--ink2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--surface)}
.hint{flex-basis:100%;font-size:10px;color:var(--ink3)}

/* features */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:13px;align-items:start}
.fcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}
.fcard:hover{border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.fcard .head{display:flex;align-items:baseline;gap:9px;width:100%;text-align:left;padding:12px 14px;cursor:pointer}
.fcard .head:hover{background:var(--surface2);border-radius:8px 8px 0 0}
.fcard .caret{flex:none;color:var(--ink3);font-size:10px;transition:transform .15s}
.fcard.expanded .caret{transform:rotate(90deg)}
.fcard .head .hname{font-size:13.5px;font-weight:700;color:var(--ink)}
.fcard .head .hcount{margin-left:auto;flex:none;font-size:9.5px;color:var(--ink3);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.fcard .body{display:none;padding:0 14px 15px}
.fcard.expanded .body{display:block}
.fcard .dom{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:0 0 8px}
.fcard .desc{font-size:12px;color:var(--ink2);margin-bottom:11px}
.fcard .head .dom{margin:0}
.frow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:baseline;padding:5px 0;border-top:1px dashed var(--line)}
.frow:first-of-type{border-top:none}
.layer{font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;padding:1px 7px;border-radius:999px;border:1px solid var(--bc,var(--ink3));color:var(--bc,var(--ink3));white-space:nowrap}
.frow .loc{font-size:11.5px;color:var(--ink);overflow-wrap:anywhere}
.frow .loc .ln{color:var(--accent)}
.frow .note{color:var(--ink3)}
.frow a.filelink{color:inherit;text-decoration:none;border-bottom:1px dashed var(--line)}
.frow a.filelink:hover{color:var(--accent);border-bottom-color:var(--accent)}
.goto{font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);border:1px solid var(--line);border-radius:999px;padding:1px 7px;white-space:nowrap}
.goto:hover{color:var(--accent);border-color:var(--accent)}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:9px}
.tags span{font-size:10px;color:var(--ink3);background:var(--surface2);border-radius:4px;padding:1px 7px}
.empty{color:var(--ink3);font-size:12px;padding:22px 0}

/* architecture — force graph */
.archgrid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;align-items:stretch}
@media (max-width:1100px){.archgrid{grid-template-columns:1fr}}
.graphbox{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;height:clamp(520px,calc(100vh - 190px),900px)}
#graph{position:absolute;inset:0;cursor:grab}
#graph.dragging{cursor:grabbing}
#graph svg{position:absolute;inset:0;width:100%;height:100%}
#graph svg line{stroke:var(--line);stroke-width:1.2;transition:stroke .15s,opacity .15s}
#graph.hot svg line{opacity:.12}
#graph.hot svg line.in{stroke:var(--c1);opacity:.95;stroke-width:1.8}
#graph.hot svg line.out{stroke:var(--c8);opacity:.95;stroke-width:1.8}
.node{position:absolute;transform:translate(-50%,-50%);cursor:grab;user-select:none;z-index:2}
.node .dot{width:12px;height:12px;border-radius:50%;background:var(--kc,var(--c-other));margin:0 auto;box-shadow:0 0 0 3px color-mix(in srgb,var(--kc) 22%,transparent)}
.node .cap{display:block;text-align:center;font-size:11px;font-weight:700;color:var(--ink);white-space:nowrap;margin-top:5px;text-shadow:0 1px 3px var(--bg),0 0 6px var(--bg)}
.node .cm{display:block;text-align:center;font-size:9px;color:var(--ink3);white-space:nowrap}
.node.sel .dot{box-shadow:0 0 0 3px var(--accent),0 0 14px var(--accent)}
.node.hot .dot{box-shadow:0 0 0 4px var(--kc),0 0 16px var(--kc)}
#graph.hot .node.dim{opacity:.22}
.archpanel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:15px 16px;box-shadow:var(--shadow);overflow-y:auto;max-height:clamp(520px,calc(100vh - 190px),900px);position:sticky;top:16px}
.archpanel h3{font-size:15px;font-weight:700;overflow-wrap:anywhere}
.archpanel .badges{display:flex;gap:6px;margin:8px 0 10px;flex-wrap:wrap}
.badge{font-size:9px;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--ink2)}
.badge.kind{border-color:var(--kc);color:var(--kc)}
.archpanel p.purpose{font-size:12px;color:var(--ink2)}
.pstats{display:flex;margin:12px 0;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.pstats div{flex:1;padding:7px 9px;border-left:1px solid var(--line)}
.pstats div:first-child{border-left:none}
.pstats .v{font-size:14px;font-weight:700}
.pstats .l{font-size:9px;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em}
.archpanel h4{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin:14px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips button{font-size:11px;padding:2px 9px;border:1px solid var(--line);border-radius:999px;color:var(--ink2);background:var(--surface2)}
.chips button:hover{border-color:var(--c1);color:var(--c1)}
.chips.out button:hover{border-color:var(--c8);color:var(--c8)}
.areas{list-style:none}
.areas li{font-size:11.5px;color:var(--ink2);padding:4px 0 4px 11px;border-left:2px solid var(--line);margin-bottom:4px}
.areas li b{color:var(--ink)}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:9px 14px;border-top:1px solid var(--line);font-size:10.5px;color:var(--ink2);position:absolute;left:0;right:0;bottom:0;background:var(--surface)}
.legend .li{display:inline-flex;align-items:center;gap:5px}
.sw{width:11px;height:11px;border-radius:3px;display:inline-block}
.sw.line{height:2px;width:14px}

/* files — icicle */
.tmbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.tmbar select{font-family:var(--mono);font-size:12px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 9px;max-width:300px}
.crumbs{display:flex;align-items:center;gap:2px;flex-wrap:wrap;font-size:11.5px}
.crumbs button{color:var(--accent);padding:2px 4px;border-radius:4px}
.crumbs button:hover{background:var(--surface2)}
.crumbs .here{color:var(--ink);font-weight:700;padding:2px 4px}
.typel{display:flex;gap:10px;flex-wrap:wrap;margin-left:auto;font-size:10.5px;color:var(--ink2)}
.typel .li{display:inline-flex;align-items:center;gap:5px}
#icicle{position:relative;width:100%;height:clamp(460px,calc(100vh - 250px),820px);background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:auto;box-shadow:var(--shadow)}
.icell{position:absolute;overflow:hidden;border:1px solid var(--bg)}
.icell.file{cursor:pointer}
.icell.file:hover{outline:2px solid var(--accent);outline-offset:-2px;z-index:3}
.icell.dir{background:var(--surface2)!important;cursor:pointer}
.icell.dir:hover{outline:2px solid var(--ink3);outline-offset:-2px}
.icell .lab{position:absolute;top:1px;left:4px;right:4px;font-size:10px;line-height:1.35;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;text-shadow:0 1px 2px var(--bg)}
.tmfoot{display:flex;gap:20px;flex-wrap:wrap;margin-top:12px;font-size:11px;color:var(--ink2)}
.tmfoot .kv b{color:var(--ink)}

/* facets */
.fgrid2{display:grid;grid-template-columns:1fr;gap:16px;align-items:start}
.fgrid2.cols2{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
@media (max-width:1100px){.fgrid2.cols2{grid-template-columns:1fr}}
.fcard2{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:15px 17px 17px;box-shadow:var(--shadow)}
.fcard2>h3{font-size:12.5px;font-weight:700;margin-bottom:2px}
.fcard2>.sub{font-size:11.5px;color:var(--ink2);margin-bottom:12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.tile .v{font-size:24px;font-weight:700;color:var(--accent)}
.tile .l{font-size:11px;color:var(--ink2)}
.tile .s{font-size:9.5px;color:var(--ink3)}
.clegend{display:flex;gap:13px;flex-wrap:wrap;font-size:11px;color:var(--ink2);margin-bottom:10px}
.sortbar{display:flex;gap:4px;margin-bottom:10px}
.sortbar button{font-size:10px;text-transform:uppercase;letter-spacing:.05em;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--ink3)}
.sortbar button.on{border-color:var(--accent);color:var(--accent)}
.bar{display:grid;grid-template-columns:170px minmax(0,1fr) minmax(80px,auto);gap:12px;align-items:center;padding:5px 0;border-top:1px dashed var(--line)}
.bar:first-child{border-top:none}
.bar:hover{background:var(--surface2)}
.bar .bn{font-size:11.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .track{display:flex;gap:2px;height:12px}
.bar .track div{border-radius:2px;min-width:3px}
.bar .vals{font-size:10.5px;color:var(--ink2);text-align:right}
.bar .vals b{color:var(--ink)}
.gcols{columns:3 280px;column-gap:13px}
.grp{break-inside:avoid;background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin-bottom:13px}
.grp.accent{border-left:3px solid var(--accent)}
.grp h4{font-size:10.5px;font-weight:700;display:flex;justify-content:space-between;margin-bottom:8px}
.grp h4 .cnt{color:var(--ink3);font-weight:400}
.gchips{display:flex;flex-wrap:wrap;gap:4px}
.gchips span{font-size:10px;color:var(--ink2);background:var(--surface);border-radius:4px;padding:2px 7px}
.rtree details{margin-left:13px}
.rtree>details{margin-left:0}
.rtree summary{font-size:11.5px;cursor:pointer;padding:2px 0;list-style:none;display:flex;align-items:center;gap:6px}
.rtree summary::before{content:">";color:var(--ink3);font-size:9px}
.rtree details[open]>summary::before{content:"v"}
.rtree .leaf{display:flex;align-items:center;gap:7px;padding:2px 0 2px 14px;margin-left:13px}
.rtree>.leaf{margin-left:0;padding-left:0}
.rtree .leaf .p{font-size:11.5px;color:var(--ink2)}
.rt-badge{font-size:8.5px;letter-spacing:.06em;padding:1px 6px;border-radius:999px;border:1px solid var(--bc,var(--ink3));color:var(--bc,var(--ink3));text-transform:uppercase}
.loclist{list-style:none}
.loclist li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:6px 0;border-top:1px dashed var(--line)}
.loclist li:first-child{border-top:none}
.loclist .jn{font-size:11.5px;font-weight:600;overflow-wrap:anywhere}
.loclist .jm{font-size:10px;color:var(--ink3);white-space:nowrap}
.loclist .jbar{grid-column:1/-1;height:4px;border-radius:2px;background:var(--surface2);overflow:hidden}
.loclist .jbar div{height:100%;background:var(--accent);border-radius:2px}
.loclist li.muted .jn{color:var(--ink3);font-weight:400}
.subhead{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin:15px 0 6px}

#tip{position:fixed;z-index:80;display:none;max-width:400px;background:var(--ink);color:var(--bg);font-size:11px;line-height:1.5;padding:7px 10px;border-radius:6px;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.4);overflow-wrap:anywhere}
footer{position:relative;z-index:1;border-top:1px solid var(--line);margin-top:26px;padding:16px 0 30px;font-size:10.5px;color:var(--ink3);max-width:1000px}
@media (max-width:900px){body{grid-template-columns:1fr}aside{position:static;height:auto}}
</style>
</head>
<body>
<div class="crt"></div>

<aside>
  <div class="brand" id="brand"></div>
  <nav id="nav" role="tablist"></nav>
  <div class="statlist" id="statlist"></div>
  <div class="sideblock">
    <h4>open with</h4>
    <select id="editorPick" title="点击代码行时用哪个编辑器打开">
      <option value="vscode">VS Code</option>
      <option value="cursor">Cursor</option>
      <option value="windsurf">Windsurf</option>
      <option value="trae">Trae</option>
      <option value="idea">JetBrains</option>
      <option value="sublime">Sublime Text</option>
      <option value="system">系统默认</option>
    </select>
  </div>
  <div class="sidefoot">
    <button class="theme-btn" id="themeBtn">theme: terminal</button>
    <div class="meta" id="sideMeta"></div>
  </div>
</aside>

<main>
  <section class="view" id="v-features">
    <div class="vhead">
      <h2>功能地图 — 功能点 → 代码</h2>
      <div class="sub">点卡片里的任意代码行，用所选编辑器直接打开对应文件与行号</div>
    </div>
    <div class="toolbar">
      <input id="featSearch" type="search" placeholder="grep 功能点 / 标签 / 文件路径…" autocomplete="off">
      <button class="pill" id="expandAll">展开全部</button>
      <button class="pill" id="collapseAll">折叠全部</button>
      <span class="pill" id="featCount"></span>
      <span class="hint" id="featHint"></span>
    </div>
    <div class="fgrid" id="fgrid"></div>
    <div class="empty" id="featEmpty" style="display:none">没有匹配的功能点。</div>
  </section>

  <section class="view" id="v-arch">
    <div class="vhead">
      <h2>模块依赖图 — 力导向</h2>
      <div class="sub">拖动节点可重排 · 悬停看 imports（绿）/ imported-by（橙）· 点击查看模块详情</div>
    </div>
    <div class="archgrid">
      <div class="graphbox">
        <div id="graph"></div>
        <div class="legend" id="legend"></div>
      </div>
      <aside class="archpanel" id="panel"></aside>
    </div>
  </section>

  <section class="view" id="v-files">
    <div class="vhead">
      <h2>文件浏览器 — 冰柱图</h2>
      <div class="sub">横向宽度=代码行数，行=目录深度 · 点目录下钻 · 面包屑返回</div>
    </div>
    <div class="tmbar">
      <select id="modSelect"></select>
      <div class="crumbs" id="crumbs"></div>
      <div class="typel" id="typel"></div>
    </div>
    <div id="icicle"></div>
    <div class="tmfoot" id="tmfoot"></div>
  </section>

  <div id="facetViews"></div>
  <footer id="footNote"></footer>
</main>

<div id="tip"></div>

<script>
const DATA = __CODEFUNCTION_DATA__;

/* ---------- helpers ---------- */
const $ = (s, el) => (el || document).querySelector(s);
const esc = (s) => String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const nfmt = (n) => (n || 0).toLocaleString("en-US");

/* ============================================================
   ARCHITECTURE — force-directed network
   ============================================================ */
const graphEl=$("#graph"),panelEl=$("#panel");
function kindColors(){ const cnt={}; for(const m of MODS) cnt[m.kind]=(cnt[m.kind]||0)+1; const order=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]); return new Map(order.map((k,i)=>[k,SLOTS[i%SLOTS.length]])); }
let layout={pos:new Map(),W:0,H:0};
function computeForce(){
  const W=graphEl.clientWidth||760, H=(graphEl.clientHeight||560)-46; // leave room for legend
  const nodes=MODS.map(m=>({id:m.id,x:W/2+(Math.random()-.5)*W*.85,y:H/2+(Math.random()-.5)*H*.85}));
  const idx=new Map(nodes.map((n,i)=>[n.id,i]));
  const links=(DATA.scan.edges||[]).map(e=>[idx.get(e.from),idx.get(e.to)]).filter(([a,b])=>a!=null&&b!=null);
  // Fruchterman–Reingold. Scale k to the usable area so isolated nodes spread
  // across the canvas instead of collapsing into the centre.
  const k=Math.sqrt((W*H)/Math.max(1,nodes.length))*1.9, iters=520;
  const maxDeg=(()=>{const d=new Array(nodes.length).fill(0);for(const[a,b]of links){d[a]++;d[b]++;}return d;})();
  for(let it=0; it<iters; it++){
    const t=1-it/iters;
    const fx=new Array(nodes.length).fill(0), fy=new Array(nodes.length).fill(0);
    for(let i=0;i<nodes.length;i++) for(let j=i+1;j<nodes.length;j++){
      let dx=nodes[i].x-nodes[j].x, dy=nodes[i].y-nodes[j].y; let d2=dx*dx+dy*dy||.01, d=Math.sqrt(d2); const f=k*k/d2;
      fx[i]+=dx/d*f; fy[i]+=dy/d*f; fx[j]-=dx/d*f; fy[j]-=dy/d*f;
    }
    for(const[a,b] of links){ let dx=nodes[b].x-nodes[a].x, dy=nodes[b].y-nodes[a].y; let d=Math.sqrt(dx*dx+dy*dy)||.01; const f=(d*d)/k*.14;
      fx[a]+=dx/d*f; fy[a]+=dy/d*f; fx[b]-=dx/d*f; fy[b]-=dy/d*f; }
    for(let i=0;i<nodes.length;i++){
      const pull=maxDeg[i]>0?1:2.2;
      fx[i]+=(W/2-nodes[i].x)*0.02*pull; fy[i]+=(H/2-nodes[i].y)*0.02*pull;
      nodes[i].x+=fx[i]*t*0.6; nodes[i].y+=fy[i]*t*0.6;
      nodes[i].x=Math.max(56,Math.min(W-56,nodes[i].x)); nodes[i].y=Math.max(38,Math.min(H-38,nodes[i].y));
    }
  }
  layout={pos:new Map(nodes.map(n=>[n.id,{x:n.x,y:n.y}])),W,H};
  return layout;
}
function drawEdges(){
  const svg=$("#graph").querySelector("svg");
  const lines=(DATA.scan.edges||[]).map(e=>{ const a=layout.pos.get(e.from),b=layout.pos.get(e.to); if(!a||!b)return ""; return `<line x1="${a.x.toFixed(1)}" y1="${a.y.toFixed(1)}" x2="${b.x.toFixed(1)}" y2="${b.y.toFixed(1)}" data-from="${esc(e.from)}" data-to="${esc(e.to)}"/>`; }).join("");
  svg.innerHTML=lines;
}
function renderGraph(){
  if(!MODS.length){ graphEl.innerHTML="<div style='padding:20px;color:var(--ink3)'>未检测到模块</div>"; return; }
  const kColor=kindColors();
  computeForce();
  let nodes="";
  for(const m of MODS){ const p=layout.pos.get(m.id);
    nodes+=`<div class="node" data-id="${esc(m.id)}" style="left:${p.x}px;top:${p.y}px;--kc:var(${kColor.get(m.kind)||"--c-other"})">
      <span class="dot"></span><span class="cap">${esc(m.id)}</span><span class="cm">${m.files}f · ${lfmt(m.loc)}</span></div>`; }
  graphEl.innerHTML=`<svg></svg>${nodes}`;
  drawEdges();
  const kOrder=[...new Set(MODS.map(m=>m.kind))];
  $("#legend").innerHTML=kOrder.map(k=>`<span class="li"><span class="sw" style="background:var(${kColor.get(k)||"--c-other"})"></span>${esc(k)}</span>`).join("")
    +`<span class="li"><span class="sw line" style="background:var(--c1)"></span>imports</span><span class="li"><span class="sw line" style="background:var(--c8)"></span>imported by</span>`;
  graphEl.querySelectorAll(".node").forEach(node=>{
    const id=node.dataset.id;
    node.onclick=()=>selectModule(id);
    node.onmouseenter=()=>{ graphEl.classList.add("hot"); graphEl.querySelectorAll(".node").forEach(n=>n.classList.toggle("dim",n.dataset.id!==id)); graphEl.querySelectorAll("svg line").forEach(l=>{ l.classList.toggle("in",l.dataset.from===id); l.classList.toggle("out",l.dataset.to===id); }); };
    node.onmouseleave=()=>{ graphEl.classList.remove("hot"); graphEl.querySelectorAll(".node").forEach(n=>n.classList.remove("dim")); graphEl.querySelectorAll("svg line").forEach(l=>l.classList.remove("in","out")); };
    makeDraggable(node,id);
  });
  selectModule((MODS.slice().sort((a,b)=>b.loc-a.loc)[0]||{}).id);
}
function makeDraggable(node,id){
  let dragging=false, moved=false, sx=0, sy=0, ox=0, oy=0;
  node.addEventListener("pointerdown",e=>{ dragging=true; moved=false; sx=e.clientX; sy=e.clientY; const p=layout.pos.get(id); ox=p.x; oy=p.y; node.setPointerCapture(e.pointerId); graphEl.classList.add("dragging"); e.preventDefault(); });
  node.addEventListener("pointermove",e=>{ if(!dragging)return; const dx=e.clientX-sx, dy=e.clientY-sy; if(Math.abs(dx)+Math.abs(dy)>3)moved=true; const p=layout.pos.get(id); p.x=ox+dx; p.y=oy+dy; node.style.left=p.x+"px"; node.style.top=p.y+"px"; drawEdges(); });
  const stop=()=>{ if(!dragging)return; dragging=false; graphEl.classList.remove("dragging"); if(!moved) selectModule(id); };
  node.addEventListener("pointerup",stop); node.addEventListener("pointercancel",stop);
}
function selectModule(id){
  const m=MODMAP.get(id); if(!m)return;
  graphEl.classList.remove("hot");
  graphEl.querySelectorAll(".node").forEach(n=>{ const on=n.dataset.id===id; n.classList.toggle("sel",on); n.classList.toggle("dim",false); n.classList.remove("hot"); });
  graphEl.querySelectorAll("svg line").forEach(l=>l.classList.remove("in","out"));
  const meta=META[id]||{};
  const kColor=kindColors();
  const dep=(m.deps||[]).filter(d=>MODMAP.has(d)), rev=(m.dependedBy||[]).filter(d=>MODMAP.has(d));
  panelEl.innerHTML=`<h3>${esc(m.id)}</h3>
    <div class="badges"><span class="badge kind" style="--kc:var(${kColor.get(m.kind)||"--c-other"})">${esc(m.kind)}</span><span class="badge">${esc(m.path)}</span></div>
    ${meta.purpose?`<p class="purpose">${esc(meta.purpose)}</p>`:""}
    <div class="pstats"><div><div class="v">${nfmt(m.files)}</div><div class="l">files</div></div><div><div class="v">${lfmt(m.loc)}</div><div class="l">lines</div></div><div><div class="v">${dep.length}</div><div class="l">deps</div></div><div><div class="v">${rev.length}</div><div class="l">used by</div></div></div>
    ${meta.keyAreas?`<h4>key areas</h4><ul class="areas">${meta.keyAreas.map(a=>{const [d,...r]=String(a).split(" — ");return `<li><b>${esc(d)}</b>${r.length?" — "+esc(r.join(" — ")):""}</li>`;}).join("")}</ul>`:""}
    ${dep.length?`<h4>depends on</h4><div class="chips">${dep.map(d=>`<button data-go="${esc(d)}">${esc(d)}</button>`).join("")}</div>`:""}
    ${rev.length?`<h4>used by</h4><div class="chips out">${rev.map(d=>`<button data-go="${esc(d)}">${esc(d)}</button>`).join("")}</div>`:""}`;
  panelEl.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>selectModule(b.dataset.go));
}

   ============================================================ */
function typeColor(ext){
  const map={".ts":"--c1",".tsx":"--c1",".js":"--c3",".jsx":"--c3",".mjs":"--c3",".cjs":"--c3",".vue":"--c2",".svelte":"--c2",".py":"--c4",".go":"--c5",".rs":"--c8",".java":"--c6",".kt":"--c6",".cs":"--c7",".css":"--c9",".scss":"--c9",".less":"--c9",".json":"--c-other",".md":"--c10",".mdx":"--c10",".sql":"--c3",".html":"--c8",".wxss":"--c9",".wxml":"--c2"};
  return map[ext]||"--c-other";
}
const modSelect=$("#modSelect"),crumbsEl=$("#crumbs"),icicleEl=$("#icicle"),typel=$("#typel"),tmfoot=$("#tmfoot");
const RAW=DATA.scan||{};
let icMod=(MODS.slice().sort((a,b)=>b.loc-a.loc)[0]||{}).id||null, icPath=[];
if(MODS.length){ modSelect.innerHTML=MODS.slice().sort((a,b)=>b.loc-a.loc).map(m=>`<option value="${esc(m.id)}">${esc(m.id)}</option>`).join(""); modSelect.value=icMod; modSelect.onchange=()=>{ icMod=modSelect.value; icPath=[]; renderIcicle(); }; }
function nodeAt(root,segs){ let n=root; for(const s of segs){ n=(n.c||[]).find(c=>c.n===s); if(!n)return null; } return n; }
function collectFiles(node,prefix,out){ for(const ch of node.c||[]){ if(ch.c) collectFiles(ch,prefix?prefix+"/"+ch.n:ch.n,out); else out.push({path:prefix?prefix+"/"+ch.n:ch.n,v:ch.v,e:ch.e}); } return out; }
function renderIcicle(){
  const m=MODMAP.get(icMod); if(!m||!m.tree){ icicleEl.innerHTML="<div style='padding:20px;color:var(--ink3)'>该模块无可显示文件</div>"; return; }
  const root=nodeAt(m.tree,icPath); if(!root){ icPath=[]; return renderIcicle(); }
  crumbsEl.innerHTML=`<button data-crumb="-1">${esc(m.id)}</button>`+icPath.map((s,i)=>`<span style="color:var(--ink3)">/</span><button data-crumb="${i}">${esc(s)}</button>`).join("");
  crumbsEl.querySelectorAll("button").forEach(b=>b.onclick=()=>{ const i=+b.dataset.crumb; icPath=i<0?[]:icPath.slice(0,i+1); renderIcicle(); });
  const W=Math.max(640,icicleEl.clientWidth-2);
  const rowH=22, gap=1;
  const cells=[];
  (function layout(node,x0,x1,depth){
    cells.push({node,x0,x1,depth});
    const kids=(node.c||[]).filter(k=>k.v>0);
    if(!kids.length)return;
    const total=kids.reduce((s,k)=>s+k.v,0)||1;
    let cx=x0;
    for(const k of kids.sort((a,b)=>b.v-a.v)){ const w=(k.v/total)*(x1-x0); layout(k,cx,cx+w,depth+1); cx+=w; }
  })(root,0,W,0);
  const maxDepth=Math.max(...cells.map(c=>c.depth));
  const H=(maxDepth+1)*(rowH+gap)+2;
  icicleEl.style.height=Math.max(icicleEl.clientHeight, H+4)+"px";
  icicleEl.innerHTML=cells.map(c=>{
    const x=c.x0, w=Math.max(0,c.x1-c.x0-gap), y=c.depth*(rowH+gap)+1, h=rowH;
    if(w<1.5)return "";
    const isDir=!!(c.node.c&&c.node.c.length);
    const col=isDir?"--c-other":typeColor(c.node.e);
    const lab = w>56 ? `<span class="lab">${esc(c.node.n)}${isDir?"/":""}</span>` : "";
    if(isDir) return `<div class="icell dir" data-dir="${esc(c.node.n)}" title="${esc(c.node.n)}/ · ${lfmt(c.node.v)} loc" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;background:color-mix(in srgb,var(${col}) 16%,var(--surface2))">${lab}</div>`;
    return `<div class="icell file" data-file="${esc(c.node.n)}" title="${esc(c.node.n)} · ${lfmt(c.node.v)} loc" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;background:var(${col})">${lab}</div>`;
  }).join("");
  icicleEl.querySelectorAll(".icell.dir").forEach(d=>d.onclick=()=>{ icPath=[...icPath,d.dataset.dir]; renderIcicle(); });
  icicleEl.querySelectorAll(".icell.file").forEach(f=>{ const full=[...icPath,f.dataset.file].join("/"); f.onclick=()=>{ if(REPO_ROOT) openAt((m.path==="(root)"?"":m.path+"/")+full,""); }; });
  const files=collectFiles(root,"",[]); const byType={}; for(const f of files) byType[f.e]=(byType[f.e]||0)+f.v;
  const exts=Object.keys(byType).sort((a,b)=>byType[b]-byType[a]).slice(0,8);
  tmfoot.innerHTML=`<div class="kv">path <b>${esc([m.path,...icPath].join("/"))}/</b></div>
    <div class="kv">lines <b>${nfmt(root.v||0)}</b></div>
    <div class="kv">files <b>${nfmt(root.f||0)}</b></div>
    <div class="kv">占模块 <b>${((root.v/(m.loc||1))*100).toFixed(1)}%</b></div>`;
  typel.innerHTML=exts.map(e=>`<span class="li"><span class="sw" style="background:var(${typeColor(e)})"></span>${esc(e||"其他")}</span>`).join("");
}

const BADGE_SLOTS=["--c1","--c8","--c2","--c5","--c3"];
function badgeColor(sec){ const seen=new Map(); (function walk(items){ for(const it of items||[]){ if(it.badge&&!seen.has(it.badge))seen.set(it.badge,BADGE_SLOTS[seen.size%BADGE_SLOTS.length]); walk(it.children); } })(sec.items); return b=>seen.get(b)||"--c-other"; }
function renderSection(sec,host){
  const card=document.createElement("div"); const bare=sec.kind==="tiles"; card.className=bare?"":"fcard2";
  if(!bare&&sec.title) card.innerHTML=`<h3>${esc(sec.title)}</h3>${sec.sub?`<div class="sub">${esc(sec.sub)}</div>`:""}`;
  host.appendChild(card); const body=document.createElement("div"); card.appendChild(body);
  if(sec.kind==="tiles"){ body.className="tiles"; body.innerHTML=(sec.tiles||[]).map(t=>`<div class="tile"><div class="v">${esc(t.v)}</div><div class="l">${esc(t.l)}</div><div class="s">${esc(t.s||"")}</div></div>`).join(""); }
  else if(sec.kind==="barlist"){ renderBars(sec,body); }
  else if(sec.kind==="groups"){ body.className="gcols"; body.innerHTML=(sec.groups||[]).map(g=>`<div class="grp${g.accent?" accent":""}"><h4>${esc(g.title)} <span class="cnt">${(g.chips||[]).length}</span></h4><div class="gchips">${(g.chips||[]).map(c=>`<span>${esc(c)}</span>`).join("")}</div></div>`).join(""); }
  else if(sec.kind==="tree"){ body.className="rtree"; const bc=badgeColor(sec); const node=(it,d)=>{ const bd=it.badge?`<span class="rt-badge" style="--bc:var(${bc(it.badge)})">${esc(it.badge)}</span>`:""; if(!it.children?.length)return `<div class="leaf"><span class="p">${esc(it.label)}</span>${bd}</div>`; return `<details${d<1?" open":""}><summary>${esc(it.label)}${bd?" "+bd:""}</summary>${it.children.map(c=>node(c,d+1)).join("")}</details>`; }; body.innerHTML=(sec.items||[]).map(i=>node(i,0)).join(""); }
  else if(sec.kind==="loclist"){ const max=Math.max(1,...(sec.rows||[]).map(r=>r.bar??0)); let html=""; for(const r of sec.rows||[]){ if(r.section){ html+=`</ul><h5 class="subhead">${esc(r.section)}</h5><ul class="loclist">`; continue; } html+=`<li${r.muted?' class="muted"':""}><span class="jn">${esc(r.label)}</span><span class="jm">${esc(r.meta||"")}</span>${r.bar!=null?`<span class="jbar"><div style="width:${(r.bar/max*100).toFixed(1)}%"></div></span>`:""}</li>`; } body.innerHTML=`<ul class="loclist">${html}</ul>`; }
}
function renderBars(sec,body){
  const series=sec.series||[];
  body.innerHTML=`<div class="clegend">${series.map((s,i)=>`<span class="li"><span class="sw" style="background:var(${SLOTS[i%SLOTS.length]})"></span>${esc(s.label)}</span>`).join("")}${sec.note?`<span class="li" style="color:var(--ink3)">${esc(sec.note)}</span>`:""}</div><div class="sortbar"><button data-k="value" class="on">按数值</button><button data-k="name">a–z</button></div><div class="bars"></div>`;
  const list=body.querySelector(".bars"); const total=r=>series.reduce((s,sr)=>s+(r.values?.[sr.k]||0),0); let key="value";
  const draw=()=>{ const rows=[...(sec.rows||[])]; rows.sort(key==="value"?(a,b)=>total(b)-total(a):(a,b)=>String(a.label).localeCompare(String(b.label))); const max=Math.max(1,...rows.map(total));
    list.innerHTML=rows.map(r=>{ const segs=series.map((sr,i)=>{ const v=r.values?.[sr.k]||0; return v?`<div style="width:${(v/max*100).toFixed(2)}%;background:var(${SLOTS[i%SLOTS.length]})"></div>`:""; }).join("");
      return `<div class="bar" data-l="${esc(r.label)}"><div class="bn">${esc(r.label)}</div><div class="track">${segs}</div><div class="vals"><b>${total(r)}</b>${r.meta?` · ${esc(r.meta)}`:""}</div></div>`; }).join("");
    list.querySelectorAll(".bar").forEach(el=>{ const r=(sec.rows||[]).find(x=>x.label===el.dataset.l); if(r?.tip)tipOn(el,esc(r.tip)); }); };
  body.querySelector(".sortbar").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b)return; key=b.dataset.k; body.querySelectorAll(".sortbar button").forEach(x=>x.classList.toggle("on",x===b)); draw(); }); draw();
}
const facetHost=$("#facetViews");
for(const f of DATA.facets||[]){ const sec=document.createElement("section"); sec.className="view"; sec.id="v-facet-"+f.id;
  sec.innerHTML=`<div class="vhead"><h2>${esc(f.title)}${f.headline?` — <span style="font-weight:400;color:var(--ink3)">${esc(f.headline)}</span>`:""}</h2>${f.sub?`<div class="sub">${esc(f.sub)}</div>`:""}</div>`;
  const grid=document.createElement("div"); grid.className="fgrid2"+(f.columns===2?" cols2":""); sec.appendChild(grid);
  for(const s of f.sections||[]) renderSection(s,grid); facetHost.appendChild(sec); }

/* ---------- boot ---------- */
const init=location.hash.replace("#","");
switchTab(tabDefs.some(t=>t.id===init)?init:(hasFeatures?"features":"arch"));
</script>
</body>
